    <path d="M60 151 C64 139 77 135 87 140 C96 144 95 155 86 160 C77 165 68 160 63 157Z"/>
    <path d="M180 151 C176 139 163 135 153 140 C144 144 145 155 154 160 C163 165 172 160 177 157Z"/>
    <path d="M80 169 C91 174 98 178 101 181 C100 176 104 174 108 176 C114 178 114 185 109 189 L105 192 C110 200 114 210 116 219 C107 202 99 189 88 182 C82 178 79 173 80 169Z"/>
    <path d="M160 169 C149 174 142 178 139 181 C140 176 136 174 132 176 C126 178 126 185 131 189 L135 192 C130 200 126 210 124 219 C133 202 141 189 152 182 C158 178 161 173 160 169Z"/>
