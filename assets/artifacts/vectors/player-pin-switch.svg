<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Dark round player pin with a pale stylized skull and small central star">
  <title>Player pin</title>
  <defs><clipPath id="pin-rim"><circle cx="120" cy="120" r="102"/></clipPath></defs>

  <!-- A narrow rim and two quiet highlights suggest the glossy black pin. -->
  <circle cx="120" cy="120" r="105" fill="#101112"/>
  <circle cx="120" cy="120" r="102" fill="#202223"/>
  <path d="M24 103 C31 64 62 33 100 20 C77 30 61 46 58 68 C56 89 44 108 24 119Z" fill="#4e5152" opacity=".42"/>
  <path d="M158 217 C181 207 201 188 214 167 C207 191 188 209 158 217Z" fill="#454849" opacity=".3" clip-path="url(#pin-rim)"/>

  <!-- The pale cranium, pointed cheekbones and tapered jaw form the stylized skull. -->
  <path d="M120 16 C94 18 71 32 61 56 C56 69 56 88 59 101 C54 114 39 124 27 130 C44 133 55 143 62 156 C72 173 90 188 104 203 C112 212 117 220 120 224 C123 220 128 212 136 203 C150 188 168 173 178 156 C185 143 196 133 213 130 C201 124 186 114 181 101 C184 88 184 69 179 56 C169 32 146 18 120 16Z" fill="#f1f2f1"/>

