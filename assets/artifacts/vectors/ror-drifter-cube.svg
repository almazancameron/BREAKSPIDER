<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Blue framed purple Drifter cube with a cross latch">
  <title>Drifter cube</title>

  <!-- Uneven outer profile and the two differently sized faces. -->
  <path d="M24 47 Q24 39 37 37 L106 32 Q113 29 121 32 L239 70 Q245 72 244 79 L236 104 L218 202 Q216 212 207 216 L169 234 Q163 237 156 233 L35 205 Q28 203 27 196 L26 76Z" fill="#15132b"/>
  <path d="M34 56 169 82 164 222 34 197Z" fill="#4b4168"/>
  <path d="m177 86 61-12-21 126-51 22Z" fill="#433e64"/>

  <!-- The upper and lower courses meet a broad horizontal timber. -->
  <path d="M40 66 160 88 163 112 39 100Z" fill="#65577c"/>
  <path d="M44 73 153 94" fill="none" stroke="#766689" stroke-width="2" opacity=".6"/>
  <path d="M39 100 165 112 164 136 39 123Z" fill="#383550"/>
  <path d="M40 102 163 115M39 122l124 13" fill="none" stroke="#2a2946" stroke-width="2"/>
  <path d="M39 124 162 137 153 218 39 196Z" fill="#514565"/>
  <path d="M40 166 80 175 93 186 39 174Z" fill="#625476"/>
  <path d="M40 174 84 183M41 190l109 24" fill="none" stroke="#37314f" stroke-width="3"/>

  <!-- One upright plank is crossed by a broad diagonal timber. -->
  <path d="M128 130 160 136 153 215 124 208Z" fill="#645273" stroke="#3a3455" stroke-width="2" stroke-linejoin="round"/>
  <path d="M143 138 148 139 142 191" fill="none" stroke="#81698d" stroke-width="2" opacity=".65"/>
  <path d="M66 124 84 127 144 188 138 205 123 200 74 145Z" fill="#625173" stroke="#37314f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M72 128 128 188M84 131l54 59" fill="none" stroke="#806b91" stroke-width="2" opacity=".65"/>

  <!-- Recessed narrow right face with its slanted inset and single middle band. -->
  <path d="M187 98 226 87 209 190 177 207Z" fill="#332f54"/>
  <path d="M192 102 221 94 205 185 181 197Z" fill="#5a4e78"/>
  <path d="m198 111 16-6-26 64Z" fill="#716083"/>
  <path d="M179 145 222 145 219 168 176 169Z" fill="#3b365a"/>
  <path d="M184 174 210 168 206 188 180 200Z" fill="#64547d"/>

  <!-- The lid is shallow; its inset is darker than the irregular cyan rim. -->
  <path d="M27 48 Q30 41 42 40 L108 34 Q115 33 121 35 L239 72 174 88 55 56Z" fill="#358ec4"/>
  <path d="M48 47 110 39 222 74 171 81 74 53Z" fill="#67b6d8"/>
