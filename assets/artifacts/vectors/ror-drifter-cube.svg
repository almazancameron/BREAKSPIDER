    <path d="M84 174 95 168 112 176 110 198 100 203 83 198 83 181Z" fill="#378cbb"/>
    <path d="M84 174 95 168 112 176 100 182Z" fill="#78c1d5"/>
    <path d="M84 174 100 182 100 203 83 198Z" fill="#469ac5"/>
    <path d="M100 182 112 176 110 198 100 203Z" fill="#2877ae"/>
  </g>
  <path d="M91 185h2m25-1h2" fill="none" stroke="#244f83" stroke-width="3" stroke-linecap="round"/>
</svg>
