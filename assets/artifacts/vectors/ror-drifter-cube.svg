  <path d="M80 46 111 41 174 62 205 72 166 72Z" fill="#28598f"/>
  <path d="M56 51 164 80 175 86 58 58Z" fill="#a2dcdf" opacity=".8"/>
  <path d="M111 34 239 72 231 77 111 39Z" fill="#77bbd4"/>

  <!-- Bent metal frame: wider at the front-left and on the front-right corner. -->
  <path d="M27 49 43 42 55 48 38 73 36 173 29 181 27 75Z" fill="#2a7fc1"/>
  <path d="M38 72 45 57 43 169 37 181Z" fill="#80c5d8"/>
  <path d="M161 80 175 85 190 101 177 119 168 211 157 224 162 119Z" fill="#378bc5"/>
  <path d="M169 88 178 105 171 202 165 215 170 119Z" fill="#84cbd9"/>
  <path d="M234 76 243 74 235 104 226 111Z" fill="#2476ba"/>
  <path d="M225 106 233 98 217 197 209 206Z" fill="#77b8d0"/>

  <!-- Bottom rails beneath the corner armor. -->
  <path d="M30 173 39 178 40 194 161 219 171 209 169 226 157 234 34 204 28 197Z" fill="#327fb8"/>
  <path d="M39 196 154 224 164 216 157 229 35 200Z" fill="#85c6d4"/>
  <path d="M176 213 213 199 217 206 169 230 160 230Z" fill="#2477b4"/>
  <path d="M173 216 208 201 216 207 181 226 166 230Z" fill="#2a83bd"/>

  <!-- Plates wrap over the upper and lower corners; seams mark each fold. -->
  <g stroke="#235b93" stroke-width="2" stroke-linejoin="round">
    <path d="M27 47 Q30 42 42 40 L56 48 38 74 28 66Z" fill="#2c82c1"/>
    <path d="M160 80 175 84 190 98 182 111 172 118 162 107Z" fill="#2e85c1"/>
    <path d="M228 73 240 71 Q244 72 243 77 L236 101 226 109 229 87Z" fill="#267cba"/>
    <path d="M30 173 39 180 52 202 36 203 29 196Z" fill="#176bb2"/>
    <path d="M154 216 170 207 182 226 167 234 139 227Z" fill="#196fb4"/>
  </g>
  <path d="M160 80 175 84 190 98 178 102 168 90Z" fill="#56a9ce"/>
  <path d="M160 80 168 90 178 102 172 118 162 107Z" fill="#318bc1"/>
  <path d="M178 102 190 98 182 111 172 118Z" fill="#206da9"/>
  <path d="M228 73 240 71 235 85 229 88Z" fill="#4da0cd"/>
  <path d="M29 48 38 67 53 49M168 90l10 12-6 16M230 86l5-2 5-11M30 176l10 17 9 9M141 226l16-7 12-10" fill="none" stroke="#8bcbd8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Two offset blue cube faces make the low clasp. -->
  <g stroke="#25476e" stroke-width="2" stroke-linejoin="round">
    <path d="M102 172 113 168 126 177 125 190 112 194 102 184Z" fill="#378cbb"/>
    <path d="M102 172 113 168 125 177 113 181Z" fill="#72bdd4"/>
