let current='home',device='desktop',fit=true;
function nav(){const groups=[['Overview',[['rationale','Design synthesis']]],['Primary screens',screens.filter(s=>s[8]==='primary').map(s=>[s[0],s[1]])],['Important states',screens.filter(s=>s[8]==='states').map(s=>[s[0],s[1]])]];document.getElementById('nav').innerHTML=groups.map(([label,items])=>`<h2>${label}</h2><div class="nav-items">${items.map(([id,name],i)=>`<button data-go="${id}" aria-current="${id===current}"><span class="num">${String(i+1).padStart(2,'0')}</span>${name}</button>`).join('')}</div>`).join('')}
function show(id,scroll=true){if(id==='rationale'){document.getElementById('rationale').scrollIntoView({behavior:'smooth'});return}if(!renderers[id])id='home';current=id;const s=screens.find(x=>x[0]===id);if(id==='mobile-menu')device='mobile';const mobile=device==='mobile';document.getElementById('frame').className=`frame ${device} ${fit?'fit':''}`;document.getElementById('frame').innerHTML=renderers[id](mobile);document.getElementById('frame').scrollTop=0;document.getElementById('screen-title').textContent=s[1];document.getElementById('screen-subtitle').textContent=s[2];document.getElementById('annotation').innerHTML=`<h3>Screen notes</h3><dl><dt>Purpose</dt><dd>${s[3]}</dd><dt>UI / scroll</dt><dd>${s[4]}</dd><dt>Interactions</dt><dd>${s[5]}</dd><dt>Influences</dt><dd>${s[6]}</dd><dt>Excluded</dt><dd>${s[7]}</dd></dl>`;document.getElementById('desktop-btn').classList.toggle('active',!mobile);document.getElementById('mobile-btn').classList.toggle('active',mobile);document.getElementById('fit-btn').classList.toggle('active',fit);nav();if(scroll)document.querySelector('.mast').scrollIntoView({block:'start'});history.replaceState(null,'','#'+id)}
document.addEventListener('click',e=>{const node=e.target.closest('[data-go]');if(node){e.preventDefault();show(node.dataset.go);return}if(e.target.closest('[data-action=audio]')){e.preventDefault();const b=e.target.closest('button');b.textContent=b.textContent==='Audio: off'?'Audio: on':'Audio: off'}if(e.target.closest('[data-action=equip]')){e.target.textContent='Avatar equipped ✓'}});

document.getElementById('rationale').innerHTML=`<h2>Design synthesis / rationale</h2><p class="callout"><strong>Intent:</strong> A personal internet profile and long-running sketchbook that proves software engineering skill within 30 seconds and rewards a longer wander. Desktop is the expressive composition; mobile keeps the identity while prioritizing the reading path. These are spatial wireframes, so all imagery, copy, color, type, and motion are placeholders.</p><h3>Source audit</h3><table><tr><th>Priority</th><th>Structural consequence</th></tr><tr><td>Design philosophy</td><td>Personal profile first; cozy, chaotic, playful, professional underneath. About/contact/resume are explicit. Controlled overlap supports discovery. No professional facts are secret.</td></tr><tr><td>Site architecture</td><td>Small sticky Home / Projects / About navigation; larger public route set; one interchangeable authored Spotlight; two strong path modules; irregular secondary widgets; stable entity routes and explicit cross-links.</td></tr><tr><td>Manifest</td><td>Different references serve different jobs: Cloudland / Gaia for inhabited composition, Tiger for staged focus, Muda for one functional toy, Verdant for feed, Codrops for projects, Steam for Collection, Monster Hunter for Familiars, Foam for input translation.</td></tr><tr><td>Screenshot evidence</td><td>44 images inspected. Manual Ralts and Monster Hunter screenshots are present even though the earlier reference-analysis document described those pages as unavailable. Their visual structure can inform the assigned subsystem; the manifest still sets the limit on borrowing.</td></tr></table><p><strong>Reference limit:</strong> The collected mobile screenshots were not captured at 390 px. Mobile compositions here are design interpretations of the philosophy and architecture, with Foam supplying the principle of input translation.</p><h3>Wireframe language</h3><p>Neutral grays, open text clusters, loose media silhouettes, and lightly irregular edges represent hierarchy without final styling. The central Spotlight has one broad bounded footprint; secondary material sits directly in the page field. Shape, size, varied gutters, and a few controlled margin intrusions signal focus. Text has reserved space and never overlaps other text. Navigation labels sit inside separate sticker shapes with small whole-sticker shifts; repeated catalogues and inventories use regular grids for scanning. Desktop is a 1440 × 900 viewport with normal page scroll and a sticky 66 px site header. Mobile is 390 × 844 with a 55 px header. The prototype scrolls inside each viewport. A selected artifact is a temporary layer; article, Familiar, and project details get stable routes.</p><h3>Resolved structural decisions</h3><p><strong>Selective surfaces:</strong> The Spotlight gets one shaped field to establish the current focus. About/contact gets a deliberate bounded surface because contact details benefit from grouping. Collection retains a showcase area to distinguish equipped choices from owned items, and selected artifacts open in a focused layer. Surrounding navigation and archive material floats directly on the page.</p><ol><li><strong>Header:</strong> Breakspider identity left, small Home / Projects / About stickers centered, persistent mute and avatar right. Sketchbook is linked contextually and in the footer, not the initial three-link navbar.</li><li><strong>Home:</strong> Spotlight occupies the center and most of the first viewport. About and Projects float as the two second-tier paths; now/notes/Familiar/changelog gather at uneven distances. The first viewport is busy without enclosing every fragment in a widget. One clickable process scrap overlaps only the Spotlight media edge, while text paths remain distinct.</li><li><strong>Scroll:</strong> The page scrolls as one document. No panning canvas controls any essential content. The optional artifact pile appears below primary paths and can be inspected with click/tap/keyboard focus.</li><li><strong>One functional toy:</strong> An inspectable artifact pile is the first-pass place for a playful interface action. A later prototype can add physical motion, but its action and fallback are already clear.</li><li><strong>Mobile:</strong> Spotlight → About → Projects → current status → secondary discoveries. Site navigation becomes an explicit Menu, with mute and avatar remaining in the compact header. Artifact focus becomes tap-to-open.</li><li><strong>Discovery:</strong> Collection is public but quiet before the first unlock; a counter appears after it. The Map is a found shortcut to public routes, never the only way to reach essentials.</li></ol><h3>Screen inventory</h3><table><tr><th>Primary desktop routes</th><th>Mobile composition coverage</th><th>Behavioral states</th></tr><tr><td>Home; Projects; Pixel Pugilists; Viscap; About; Sketchbook feed; long entry; Familiar catalogue; Familiar detail; Collection empty; Map</td><td>Home, Projects, PP, Viscap, About, feed, long entry, Familiar catalogue/detail, Collection, Map; use the Mobile toggle to inspect each at 390 px</td><td>Game Spotlight; selected artifact; default profile; first unlock; Sketchbook tag filter; unlocked Collection; mobile menu</td></tr></table><h3>Reference influence and exclusions</h3><table><tr><th>Area</th><th>Borrowed principle</th><th>Explicitly excluded</th></tr><tr><td>Homepage</td><td>Cloudland place-like anchors; Gaia varied scale and open collage; Ralts profile fragments; Atomic Gothic signs of life; Kaylee centerpiece check</td><td>Cloudland illustration; Gaia-level density; a fixed retro-web costume; Kaylee symmetry</td></tr><tr><td>Focus interaction</td><td>Tiger pile → selected readable item; Foam touch translation; Muda one useful mechanical object</td><td>Hover gates, full-screen physics navigation, Foam photography/canvas aesthetic</td></tr><tr><td>Projects + writing</td><td>Work trail with a connected platform map and an active game notebook; Codrops evidence beside decisions; Verdant short/long entry distinction</td><td>Publication skin, generic case-study formula, forced article pages for tiny updates</td></tr><tr><td>Personal systems</td><td>Steam showcase versus owned items; Monster Hunter featured creature plus scannable roster</td><td>Steam economy/wiki chrome, giant cinematic panel per Familiar</td></tr></table><h3>Validation against architecture</h3><p>All proposed first-class public routes have wireframes, including the deeper long-entry and Familiar paths. Viscap is shown as one platform; Pixel Pugilists is a development notebook. About combines personal identity and directly visible contact. Homepage offers the short recruiter path and several optional wandering paths. Cross-links connect project, Familiar, and writing screens. The mobile variant keeps those paths and replaces hover with explicit selection.</p><h3>Questions deferred to visual design</h3><ul><li>Final type, palette, custom window chrome, and the exact pixel-art/illustration mix.</li><li>The shape and identity of the one functional toy, its physics, and sound design; action and accessibility behavior are established here.</li><li>Specific authored copy, photography/sprites, project media, and the first collectible's visual identity.</li><li>Animation timing, reduced-motion variants, fine spacing, and overlap within the zones established here.</li></ul><p><strong>Assumption:</strong> The creator’s name is a placeholder because it is absent from the planning documents; all address and external URLs remain placeholders until supplied. The prototype demonstrates screen relationships rather than production content or backend state.</p>`;
